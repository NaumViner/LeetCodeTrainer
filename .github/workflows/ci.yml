name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      REALTIME_AI_API_KEY: ci-server-only-secret-sentinel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24.x
      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci 2> >(tee npm-ci-errors.log >&2); then
            error="$(grep -E '^npm (error|ERR!)' npm-ci-errors.log | head -20 | tr '\n' ' ')"
            echo "::error title=npm ci failed::${error:-See the npm install log.}"
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:client-bundle

  database-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24.x
      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci 2> >(tee npm-ci-errors.log >&2); then
            error="$(grep -E '^npm (error|ERR!)' npm-ci-errors.log | head -20 | tr '\n' ' ')"
            echo "::error title=npm ci failed::${error:-See the npm install log.}"
            exit 1
          fi
      - name: Start and migrate local Supabase
        id: supabase
        run: npm run db:start
      - name: Export local application settings
        shell: bash
        run: |
          status="$(npx supabase status -o json)"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<< "$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<< "$status")" >> "$GITHUB_ENV"
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Stop local Supabase
        if: always() && steps.supabase.outcome == 'success'
        run: npm run db:stop -- --no-backup
